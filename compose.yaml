services:
  cassandra1:
    image: cassandra:4.1
    container_name: cassandra1
    hostname: cassandra1
    environment:
      CASSANDRA_CLUSTER_NAME: ClusterRSI3
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_BROADCAST_ADDRESS: cassandra1
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports: ["9042:9042"]
    networks: [cassandra-net]
    volumes: [cassandra1-data:/var/lib/cassandra]
  cassandra2:
    image: cassandra:4.1
    container_name: cassandra2
    hostname: cassandra2
    depends_on: [cassandra1]
    environment:
      CASSANDRA_CLUSTER_NAME: ClusterRSI3
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_BROADCAST_ADDRESS: cassandra2
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    networks: [cassandra-net]
    volumes: [cassandra2-data:/var/lib/cassandra]
  cassandra3:
    image: cassandra:4.1
    container_name: cassandra3
    hostname: cassandra3
    depends_on: [cassandra1]
    environment:
      CASSANDRA_CLUSTER_NAME: ClusterRSI3
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_BROADCAST_ADDRESS: cassandra3
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    networks: [cassandra-net]
    volumes: [cassandra3-data:/var/lib/cassandra]
  cassandra4:
    image: cassandra:4.1
    container_name: cassandra4
    hostname: cassandra4
    depends_on: [cassandra1]
    environment:
      CASSANDRA_CLUSTER_NAME: ClusterRSI3
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_BROADCAST_ADDRESS: cassandra4
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    networks: [cassandra-net]
    volumes: [cassandra4-data:/var/lib/cassandra]
  cassandra5:
    image: cassandra:4.1
    container_name: cassandra5
    hostname: cassandra5
    depends_on: [cassandra1]
    environment:
      CASSANDRA_CLUSTER_NAME: ClusterRSI3
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_BROADCAST_ADDRESS: cassandra5
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    networks: [cassandra-net]
    volumes: [cassandra5-data:/var/lib/cassandra]
networks:
  cassandra-net:
    driver: bridge
volumes:
  cassandra1-data:
  cassandra2-data:
  cassandra3-data:
  cassandra4-data:
  cassandra5-data:
